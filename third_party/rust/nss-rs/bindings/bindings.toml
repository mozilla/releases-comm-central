# In this file, every section corresponds to a header file.
# A corresponding binding file will be created in $OUT_DIR.
#
# This configuration is processed by build.rs to populate `exclude` for each
# header with the types/variables/functions/enums declared for generation in
# other headers.

[nss_prelude]
types = ["SECItem", "SECItemArray", "SECItemStr", "SECStatus"]
functions = ["SECITEM_FreeArray", "SECITEM_FreeItem"]
enums = ["SECItemType", "_SECStatus"]

[nss_ssl]
types = [
  "HpkeSymmetricSuite",
  "SSLAeadContext",
  "SSLAlertDescription",
  "SSLAntiReplayContext",
  "SSLCertificateCompressionAlgorithm",
  "SSLExtensionHandler",
  "SSLExtensionType",
  "SSLExtensionWriter",
  "SSLExtraServerCertData",
  "SSLHelloRetryRequestAction",
  "SSLHelloRetryRequestCallback",
  "SSLNamedGroup",
  "SSLProtocolVariant",
  "SSLRecordWriteCallback",
  "SSLResumptionTokenCallback",
  "SSLResumptionTokenInfo",
  "SSLSecretCallback",
  "SSLSignatureScheme",
  "SSLTimeFunc",
]
functions = [
  "SSL_AlertSentCallback",
  "SSL_AuthCertificateComplete",
  "SSL_AuthCertificateHook",
  "SSL_CipherPrefSet",
  "SSL_ConfigServerCert",
  "SSL_ConfigServerSessionIDCache",
  "SSL_DestroyResumptionTokenInfo",
  "SSL_ExportKeyingMaterial",
  "SSL_ForceHandshake",
  "SSL_GetChannelInfo",
  "SSL_GetExperimentalAPI",
  "SSL_GetImplementedCiphers",
  "SSL_GetNextProto",
  "SSL_GetNumImplementedCiphers",
  "SSL_GetPreliminaryChannelInfo",
  "SSL_GetResumptionTokenInfo",
  "SSL_ImportFD",
  "SSL_NamedGroupConfig",
  "SSL_OptionGetDefault",
  "SSL_OptionSet",
  "SSL_PeerCertificate",
  "SSL_PeerSignedCertTimestamps",
  "SSL_PeerStapledOCSPResponses",
  "SSL_ResetHandshake",
  "SSL_SendAdditionalKeyShares",
  "SSL_SetNextProtoNego",
  "SSL_SetURL",
  "SSL_VersionRangeSet",
]
enums = [
  "HpkeAeadId",
  "HpkeKdfId",
  "SSLAuthType",
  "SSLCipherAlgorithm",
  "SSLCompressionMethod",
  "SSLContentType",
  "SSLExtensionType",
  "SSLHandshakeType",
  "SSLHelloRetryRequestAction",
  "SSLKEAType",
  "SSLMACAlgorithm",
  "SSLNamedGroup",
  "SSLNextProtoState",
  "SSLProtocolVariant",
  "SSLSecretDirection",
  "SSLSignatureScheme",
]
variables = [
  "SSL_LIBRARY_VERSION_TLS_\\d_\\d",
  "SSL_NumImplementedCiphers",
  "ssl_preinfo_.*",
]

[nss_sslopt]
variables = [
  "SSL_ENABLE_0RTT_DATA",
  "SSL_ENABLE_ALPN",
  "SSL_ENABLE_CH_EXTENSION_PERMUTATION",
  "SSL_ENABLE_EXTENDED_MASTER_SECRET",
  "SSL_ENABLE_GREASE",
  "SSL_ENABLE_HELLO_DOWNGRADE_CHECK",
  "SSL_ENABLE_OCSP_STAPLING",
  "SSL_ENABLE_SESSION_TICKETS",
  "SSL_ENABLE_SIGNED_CERT_TIMESTAMPS",
  "SSL_ENABLE_TLS13_COMPAT_MODE",
  "SSL_NO_LOCKS",
  "SSL_RECORD_SIZE_LIMIT",
  "SSL_REQUEST_CERTIFICATE",
  "SSL_REQUIRE_CERTIFICATE",
  "SSL_SUPPRESS_END_OF_EARLY_DATA",
]

[nss_ciphers]
variables = ["TLS_.*"]
exclude = [".*_(?:EXPORT(?:1024)?|anon|DES|RC4)_.*", ".*_(?:MD5|NULL_SHA)"]

[nss_secerr]
types = ["SECErrorCodes"]
enums = ["SECErrorCodes"]

[nss_sslerr]
types = ["SSLErrorCodes"]
enums = ["SSLErrorCodes"]

[nss_init]
functions = [
  "NSS_Initialize",
  "NSS_IsInitialized",
  "NSS_NoDB_Init",
  "NSS_SetDomesticPolicy",
  "NSS_Shutdown",
  "NSS_VersionCheck",
]
variables = ["NSS_INIT_READONLY", "SECMOD_DB"]

