---
schema: 1

bugzilla:
  product: "Thunderbird"
  component: "Build Config"

origin:
  name: "rnp"
  description: "High performance C++ OpenPGP library"

  url: "https://www.rnpgp.org/"
  license: BSD-2-Clause

  release: 4f5c4e6e9b9a895762290bf03ed342ea8e69bbd2 (2026-09-07T13:32:50Z).

  revision: 4f5c4e6e9b9a895762290bf03ed342ea8e69bbd2

  license-file: LICENSE.md

vendoring:
  url: https://github.com/rnpgp/rnp
  source-hosting: github
  tracking: commit

  skip-vendoring-steps:
    - hg-add
    - spurious-check
    - update-moz-build

  keep:
    - module.ver
    - rnp_experimental.symbols
    - experimental-features.mozbuild
    - src/lib/rnp/rnp_export.h
    # Upstream carries src/libsexpp as a git submodule. Commit snapshots from
    # GitHub do not contain submodule contents, so the in-tree copy is retained
    # across vendoring runs and has to be updated by hand when upstream bumps
    # the submodule.
    - src/libsexpp/**

  exclude:
    - "**"
    - ".*"
    - ".*/**"

  include:
    - doc/
    - docs/
    - include/
    - src/common/
    - src/examples/
    - src/fuzzing/
    - src/lib/
    - src/librekey/
    - src/librepgp/
    - src/rnp/
    - src/rnpkeys/
    - src/tests/
    - CHANGELOG.md
    - LICENSE-OCB.md
    - LICENSE.md
    - README.adoc
    - version.txt

  update-actions:
    - action: replace-in-file-regex
      file: '{yaml_dir}/../README.rnp_experimental'
      pattern: '\[(tag v[0-9\.]+|commit [0-9a-f]+)\]'
      with: '[commit {revision}]'
    # Update rnp_experimental.symbols with exported functions
    - action: run-command
      cwd: "{yaml_dir}"
      command: python
      args: ["../../python/thirdroc/thirdroc/rnp_symbols.py", "include/rnp/rnp.h", "rnp_experimental.symbols",
             "-D", "RNP_EXPERIMENTAL_PQC"]
