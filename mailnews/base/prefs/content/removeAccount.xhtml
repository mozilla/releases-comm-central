<!DOCTYPE html [
<!ENTITY % brandDTD SYSTEM "chrome://branding/locale/brand.dtd">
%brandDTD;
<!ENTITY % removalDTD SYSTEM "chrome://messenger/locale/removeAccount.dtd">
%removalDTD;
]>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      width="600"
      scrolling="false">
<head>
  <title>&dialogTitle;</title>
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src chrome:"
  />
  <link rel="stylesheet" href="chrome://global/skin/checkbox.css" />
  <link
    rel="stylesheet"
    href="chrome://messenger/skin/shared/preferences/removeAccount.css"
  />

  <link rel="localization" href="branding/brand.ftl" />
  <link rel="localization" href="messenger/removeAccount.ftl" />
  <script defer="defer" src="chrome://messenger/content/removeAccount.js"></script>
</head>
<html:body xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
<dialog id="removeAccountDialog"
        buttons="accept,disclosure,cancel"
        buttonlabelaccept="&removeButton.label;"
        buttonaccesskeyaccept="&removeButton.accesskey;"
        defaultButton="cancel">
  <stringbundle id="bundle_removeAccount"
                src="chrome://messenger/locale/removeAccount.properties"/>
  <vbox id="removeAccountSection">
    <label id="accountName"></label>
    <separator class="thin"/>
    <vbox>
      <checkbox id="removeAccount"
                label="&removeAccount.label;"
                checked=""
                disabled=""
                accesskey="&removeAccount.accesskey;" />
      <vbox class="indent" collapsed="collapsed">
        <description>
          &removeAccount.desc;
        </description>
      </vbox>
    </vbox>
    <vbox id="removeDataPossibility">
      <checkbox id="removeData"
                label="&removeData.label;"
                labelChat="&removeDataChat.label;"
                accesskey="&removeData.accesskey;"
                accesskeyChat="&removeDataChat.accesskey;"
                checked=""/>
      <vbox class="indent" collapsed="collapsed">
        <description id="localAccount" collapsed="collapsed">
          &removeDataLocalAccount.desc;
        </description>
        <description id="serverAccount" collapsed="collapsed">
          &removeDataServerAccount.desc;
        </description>
        <description id="chatAccount" collapsed="collapsed">
          &removeDataChatAccount.desc;
        </description>
        <hbox align="center">
          <button id="showLocalDirectory"
                  label="&showData.label;"
                  accesskey="&showData.accesskey;"/>
          <label id="localDirectory" collapsed="collapsed"/>
        </hbox>
      </vbox>
    </vbox>
    <vbox id="removeOutgoingsPossibility" class="remove-list-container" collapsed="collapsed">
      <checkbox id="removeOutgoings" checked=""/>
      <description class="indent tip-caption"></description>
    </vbox>
    <vbox id="removeAddressBooksPossibility" class="remove-list-container" collapsed="collapsed">
      <checkbox id="removeAddressBooks" checked=""/>
      <description class="indent tip-caption"></description>
    </vbox>
    <vbox id="removeCalendarsPossibility" class="remove-list-container" collapsed="collapsed">
      <checkbox id="removeCalendars" checked=""/>
      <description class="indent tip-caption"></description>
    </vbox>
    <vbox id="removeLoginsPossibility" collapsed="collapsed">
      <checkbox id="removeLogins" checked=""/>
    </vbox>
  </vbox>
  <vbox id="confirmationSection" align="center" pack="center" flex="1" hidden="hidden">
    <label id="success" hidden="hidden">&progressSuccess;</label>
    <label id="failure" hidden="hidden">&progressFailure;</label>
  </vbox>
</dialog>
</html:body>
</html>
