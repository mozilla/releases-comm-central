---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - release-beetmover-push-to-release

transforms:
    - gecko_taskgraph.transforms.release_deps:transforms
    - taskgraph.transforms.task_context
    - gecko_taskgraph.transforms.bouncer_check:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    run-on-repo-type: [hg]
    name: release-bouncer-check
    description: release bouncer check
    task-context:
        from-parameters:
            release-type: release_type
        from-custom:
            - release-level
        substitution-fields:
            - run.config
            - run.bouncer-prefix
            - run.locales
            - run.cdn-urls
    run-on-projects: []  # to make sure this never runs as part of CI
    shipping-phase: push
    worker-type: b-linux
    worker:
        max-run-time: 1800
        docker-image: {in-tree: "update-verify"}
    run:
        sparse-profile: mach
        comm-checkout: true
        clone-with: hg
        config:
            - comm/testing/mozharness/configs/releases/bouncer_thunderbird.py
        bouncer-prefix:
            by-release-level:
                production: "https://download.mozilla.org/"
                staging: "https://dev.bouncer.nonprod.webservices.mozgcp.net/"
        locales:
            by-release-level:
                production: []
                staging:
                    - en-US
                    - fr
                    - de
        cdn-urls:
            by-release-level:
                production: []
                staging:
                    - ftp.stage.mozaws.net
    attributes:
        build_platform: linux64
        build_type: opt
    treeherder:
        symbol: Rel(BncChk)
        kind: test
        tier: 1

tasks:
    thunderbird:
        shipping-product: thunderbird
        index:
            product: thunderbird
            job-name: thunderbird-release-bouncer-check
        run:
            config:
                by-release-type:
                    beta: comm/testing/mozrelease/configs/releases/thunderbird_beta.yml
                    release: comm/testing/mozrelease/configs/releases/thunderbird_release.yml
                    esr.*: comm/testing/mozrelease/configs/releases/thunderbird_esr.yml
                    default: comm/testing/mozrelease/configs/releases/thunderbird_beta.yml
        treeherder:
            platform: thunderbird-release/opt
