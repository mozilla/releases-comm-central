---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - fetch
    - toolchain

transforms:
    - comm_taskgraph.transforms.cargo_audit
    - gecko_taskgraph.transforms.job
    - gecko_taskgraph.transforms.task

tasks:
    tb-rust:
        name: Thunderbird Rust cargo audit
        description: Run cargo audit against comm/rust/Cargo.lock
        run-on-projects: []  # Only run via cron
        treeherder:
            kind: other
            platform: lint/opt
            symbol: rust(cargo-audit)
            tier: 1
        worker-type: b-linux
        worker:
            docker-image: {in-tree: debian12-base}
            max-run-time: 1800
            taskcluster-proxy: true
        # Notified by the audit script itself, only when vulnerabilities are found.
        audit-notify:
            emails:
                by-level:
                    "3": ["rustsecurity@discuss.thunderbird.net"]
                    default: ["{owner}"]
            matrix-rooms:
                by-level:
                    "3": ["!TWztIhgqLawNpRBZTC:mozilla.org"]
                    default: []
        run:
            using: run-task
            comm-checkout: true
            clone-with: hg
            cwd: '{checkout}/comm/rust'
            command: >-
                python3 ../taskcluster/scripts/cargo_audit.py
                --lockfile Cargo.lock
        fetches:
            toolchain:
                - linux64-cargo-audit
