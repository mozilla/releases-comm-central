---
loader: comm_taskgraph.loader.merge:loader
only-for-project: enterprise-thunderbird
reference-base-path: taskcluster/kinds

kind-dependencies:
    - enterprise-repack-mac-signing

only-for-build-platforms:
    - macosx64-shippable/opt
    - macosx64-enterprise-shippable/opt

reference-tasks:
    - enterprise-repack-mac-notarization

transforms:
    - taskgraph.transforms.from_deps
    - comm_taskgraph.transforms.enterprise:rewrite_shipping_product
    - gecko_taskgraph.transforms.filter_notarization
    - gecko_taskgraph.transforms.chunk_partners
    - gecko_taskgraph.transforms.partner_signing
    - gecko_taskgraph.transforms.signing
    - gecko_taskgraph.transforms.repackage_routes
    - gecko_taskgraph.transforms.task

task-defaults:
    shipping-product: thunderbird-enterprise
