---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - toolchain

transforms:
    - comm_taskgraph.transforms.enterprise:rewrite_shipping_phase
    - comm_taskgraph.transforms.enterprise:rewrite_shipping_product
    - comm_taskgraph.transforms.l10n_pre:transforms
    - gecko_taskgraph.transforms.build:transforms
    - gecko_taskgraph.transforms.build_attrs:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    run-on-repo-type: [hg, git]
    shipping-phase: promote
    shipping-product: thunderbird
    treeherder:
        symbol: L10n-pre-S
    worker-type: b-linux
    worker:
        max-run-time: 900
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    use-python: default
    attributes:
        shippable: true
    locale-list:
        by-project:
            enterprise-thunderbird: comm/mail/locales/all-locales-enterprise
            default:
                by-release-level:
                    production:
                        by-release-type:
                            beta|release|esr.*: comm/mail/locales/shipped-locales
                            default: comm/mail/locales/all-locales
                    staging: comm/mail/locales/onchange-locales
    comm-locales-file:
        by-project:
            enterprise-thunderbird: comm/mail/locales/enterprise-l10n-changesets.json
            default: comm/mail/locales/l10n-changesets.json
    browser-locales-file:
        by-project:
            enterprise-thunderbird: browser/locales/enterprise-l10n-changesets.json
            default: browser/locales/l10n-changesets.json
    run:
        using: mozharness
        comm-checkout: true
        clone-with: hg
        actions:
            - clone-gecko-locales
            - clone-comm-locales
            - merge-repos
            - pack-merged
            - gen-changesets
        script: comm/taskcluster/scripts/desktop_comm_l10n.py
        config-paths:
            - comm/testing/mozharness/configs
        config:
            by-project:
                enterprise-thunderbird:
                    - single_locale/linux64.py
                    - single_locale/tc_common.py
                    - single_locale/thunderbird_split_l10n.py
                    - single_locale/enterprise_thunderbird_split_l10n.py
                    - taskcluster_nightly.py
                default:
                    - single_locale/linux64.py
                    - single_locale/tc_common.py
                    - single_locale/thunderbird_split_l10n.py
                    - taskcluster_nightly.py
        options: []
    run-on-projects: []
    optimization: null


tasks:
    shippable-l10n-pre/opt:
        description: Pre-Localization artifact build
        treeherder:
            platform: thunderbird-release/opt
