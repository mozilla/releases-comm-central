---
# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    nodejs: "20"
    # You can also specify other tool versions:
    # rust: "1.55"
    # golang: "1.17"
  jobs:
    post_install:
      # RTD installs Node.js using asdf, which wraps binaries in a bash script.
      # sphinx-js >= 5 loads jsdoc from the PATH if it cannot find it in the
      # local `node_modules/`, and fails on RTD because the executable isn't a
      # JS script. This installs jsdoc in a `node_modules/` directory under
      # `docs/`, which is the working directory for RTD builds.
      - npm install --no-save --prefix docs jsdoc@~4.0.0

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

python:
  install:
    - requirements: docs/requirements.txt
