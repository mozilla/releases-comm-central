# These categories load Thunderbird's application-specific forced-quit
# implementation only when the shared enterprise modules need it.
Classes = []

Categories = {
    "enterprise-relaunch-warning-ui": {
        "thunderbird": (
            "resource:///modules/enterprise/EnterpriseShutdown.sys.mjs",
            ProcessSelector.MAIN_PROCESS_ONLY,
        ),
    },
    "enterprise-forced-quit-hook": {
        "thunderbird": (
            "resource:///modules/enterprise/EnterpriseShutdown.sys.mjs",
            ProcessSelector.MAIN_PROCESS_ONLY,
        ),
    },
}
