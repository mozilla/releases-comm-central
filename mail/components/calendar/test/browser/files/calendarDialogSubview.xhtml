<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Calendar Dialog Subview Test</title>
    <link rel="localization" href="messenger/calendarDialog.ftl" />
    <script
      type="module"
      src="moz-src:///comm/mail/components/calendar/content/calendar-dialog-subview.mjs"
    ></script>
  </head>
  <body>
    <template id="calendarDialogSubviewTemplate">
      <main class="calendar-event-create-edit-dialog-body" tabindex="-1">
        <slot name="main"></slot>
      </main>
      <footer class="calendar-event-create-edit-dialog-footer">
        <button
          class="button icon-button back-button button-primary"
          data-l10n-id="calendar-event-create-edit-dialog-back-button"
          type="button"
        ></button>
        <slot name="footer"></slot>
      </footer>
    </template>
    <calendar-dialog-subview initial-focus-id="mainInput">
      <div slot="main">
        <input id="mainInput" value="Main content" />
      </div>
      <div slot="footer">Footer content</div>
    </calendar-dialog-subview>
    <calendar-dialog-subview id="fallbackSubview">
      <div slot="main">Fallback main content</div>
    </calendar-dialog-subview>
  </body>
</html>
