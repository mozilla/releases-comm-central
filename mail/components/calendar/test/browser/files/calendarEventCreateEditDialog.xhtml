<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
>
  <head>
    <meta charset="utf-8" />
    <title>Calendar Event Create/Edit Dialog Test</title>
    <link rel="stylesheet" href="chrome://messenger/skin/colors.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/icons.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/variables.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/widgets.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/spacings.css" />
    <link rel="localization" href="messenger/calendarDialog.ftl" />
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/variables.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/colors.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/icons.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/spacings.css" />
    <link rel="stylesheet" href="chrome://messenger/skin/widgets.css" />
    <link
      rel="stylesheet"
      href="chrome://messenger/skin/calendar/calendarDialog.css"
    />
    <script
      type="module"
      src="moz-src:///comm/mail/components/calendar/content/calendar-event-create-edit-dialog.mjs"
    ></script>
    <script
      type="module"
      src="moz-src:///comm/mail/components/calendar/content/calendar-dialog-subview.mjs"
    ></script>
    <script
      type="module"
      src="resource://testing-common/mail/ReduxTestUtils.mjs"
    ></script>
    <style>
      body {
        font: message-box;
        margin: 0;
      }

      #calendarDisplayBox {
        position: absolute;
        inset: 100px auto auto 100px;
        width: 800px;
        height: 600px;
        overflow: auto;
      }

      #calendarContent {
        position: relative;
        width: 100%;
        height: 1200px;
      }

      calendar-month-day-box,
      calendar-event-box,
      [data-calendar-range-target] {
        position: absolute;
        display: block;
        width: 100px;
        height: 100px;
      }

      #calendarCell {
        inset: 200px auto auto 100px;
      }

      #calendarEvent {
        inset: 100px auto auto 600px;
      }

      #calendarRange {
        inset: 300px auto auto 600px;
      }

      [is="calendar-event-create-edit-dialog"] {
        position: absolute;
        box-sizing: border-box;
        width: 200px;
        height: auto;
        margin: 0;
        padding: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <template id="calendarDialogSubviewTemplate">
      <main class="calendar-event-create-edit-dialog-body">
        <slot name="main"></slot>
      </main>
      <footer class="calendar-event-create-edit-dialog-footer">
        <button
          class="button icon-button back-button button-primary"
          data-l10n-id="calendar-event-create-edit-dialog-back-button"
          type="button"
        ></button>
        <slot name="footer"></slot>
      </footer>
    </template>
    <template id="calendarDialogNavigationRowTemplate">
      <div class="row">
        <slot name="icon"></slot>
        <slot name="label"></slot>
        <button
          class="button button-flat icon-button icon-only action-button"
          type="button"
        >
          <slot name="action"></slot>
        </button>
        <slot name="content"></slot>
      </div>
    </template>
    <template id="calendarEventCreateEditDialogTemplate">
      <header class="calendar-event-create-edit-dialog-header">
        <div class="calendar-name">
          <span class="calendar-color" aria-hidden="true" hidden="hidden"></span>
          <select
            class="select calendar-selector"
            data-l10n-id="calendar-event-calendar-selector"
            disabled="disabled"
          ></select>
        </div>
        <div class="calendar-actions">
          <div class="expand-control"></div>
          <div class="more-actions">
            <button
              id="calendarEventCreateEditDialogMenuButton"
              class="button icon-button icon-only button-flat menu-button"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              data-l10n-id="calendar-dialog-menu"
              hidden="hidden"
            ></button>
            <xul:menupopup
              id="calendarEventCreateEditDialogMenu"
              class="no-icon-menupopup"
            >
              <xul:menuitem
                id="calendarEventCreateEditDialogDeleteEvent"
                data-l10n-id="calendar-dialog-menu-delete"
              />
            </xul:menupopup>
          </div>
          <button
            class="button icon-button icon-only button-flat close-button"
            data-l10n-id="calendar-dialog-close-button"
            type="button"
          ></button>
        </div>
        <div class="event-title">
          <input
            class="event-title-input"
            type="text"
            maxlength="180"
            aria-required="true"
            data-l10n-id="calendar-event-title-input-new"
          />
          <span
            id="calendarEventCreateEditDialogTitleRequired"
            class="event-title-required"
            role="alert"
            hidden="hidden"
          ></span>
        </div>
      </header>
      <calendar-dialog-subview-manager
        class="calendar-event-create-edit-dialog-subview-container"
        default-subview="calendarEventCreateEditDialogMainSubview"
      >
        <div
          id="calendarEventCreateEditDialogMainSubview"
          class="calendar-event-create-edit-dialog-main-subview"
        >
          <main class="calendar-event-create-edit-dialog-body">
            <section
              class="calendar-event-create-edit-dialog-subview"
              data-subview="main"
            >
              <div class="calendar-event-create-edit-dialog-rows">
                <calendar-dialog-navigation-row
                  id="descriptionNavigationRow"
                  subview-id="calendarEventCreateEditDescriptionSubview"
                >
                  <img
                    slot="icon"
                    class="icon-description"
                    src=""
                    data-l10n-id="calendar-dialog-description-row-icon"
                  />
                  <span
                    slot="label"
                    data-l10n-id="calendar-dialog-description-label"
                  ></span>
                  <img
                    slot="action"
                    class="icon-nav-right"
                    src=""
                    data-l10n-id="calendar-dialog-description-expand-icon"
                  />
                  <span slot="content"></span>
                </calendar-dialog-navigation-row>
              </div>
            </section>
          </main>
          <footer class="calendar-event-create-edit-dialog-footer">
            <select
              class="select availability-selector"
              data-l10n-id="calendar-event-availability-selector"
              disabled="disabled"
            >
              <option
                value="default"
                data-l10n-id="calendar-event-availability-default"
              ></option>
              <option
                value="busy"
                data-l10n-id="calendar-event-availability-busy"
              ></option>
              <option
                value="free"
                data-l10n-id="calendar-event-availability-free"
              ></option>
            </select>
            <div class="status-select"></div>
            <div class="privacy-select"></div>
            <!--
              Match the production footer. aria-busy can delay announcements from
              the body, so status text must remain outside that body during Save.
            -->
            <span
              class="calendar-event-save-status"
              role="status"
              aria-live="polite"
            >
              <span class="calendar-event-save-status-text"></span>
            </span>
            <button
              id="save"
              class="calendar-event-save button button-primary"
              type="button"
              data-l10n-id="calendar-event-save"
              disabled="disabled"
            ></button>
          </footer>
        </div>
        <calendar-dialog-subview
          id="calendarEventCreateEditDescriptionSubview"
          initial-focus-id="description"
          hidden="hidden"
        >
          <div slot="main">
            <label>
              <span data-l10n-id="calendar-dialog-description-label"></span>
              <textarea id="description"></textarea>
            </label>
          </div>
        </calendar-dialog-subview>
      </calendar-dialog-subview-manager>
    </template>
    <button id="menuCreate" type="button">New Event</button>
    <button id="toolbarCreate" type="button">Create</button>
    <div id="calendarDisplayBox">
      <div id="calendarContent">
        <calendar-month-day-box id="calendarCell">
          <span id="calendarCellChild"></span>
        </calendar-month-day-box>
        <calendar-event-box id="calendarEvent">
          <span id="calendarEventChild"></span>
        </calendar-event-box>
        <div id="calendarRange" data-calendar-range-target="true">
          <span id="calendarRangeChild"></span>
        </div>
      </div>
    </div>
    <dialog is="calendar-event-create-edit-dialog"></dialog>
  </body>
</html>
