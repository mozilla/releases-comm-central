<calendar-event-guests-row
  id="guestsNavigationRow"
  subview-id="calendarEventCreateEditGuestsSubview"
>
  <img
    slot="icon"
    class="icon-attendees"
    src=""
    data-l10n-id="calendar-dialog-attendees-row-icon"
  />
  <span
    slot="label"
    class="guests-label"
    data-l10n-id="calendar-event-add-guests"
  ></span>
  <img
    slot="action"
    class="icon-nav-right"
    src=""
    data-l10n-id="calendar-event-add-guests-expand-icon"
  />
  <div class="guests-summary" hidden="hidden"></div>
</calendar-event-guests-row>
