<html:template
  id="calendarDialogToggleableRowTemplate"
  xmlns="http://www.w3.org/1999/xhtml"
>
  <div class="row">
    <slot name="icon"></slot>
    <label class="toggle-label">
      <slot name="label"></slot>
      <input class="toggle-checkbox" type="checkbox" />
    </label>
    <slot name="content"></slot>
  </div>
</html:template>
