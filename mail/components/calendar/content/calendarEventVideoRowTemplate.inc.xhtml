<calendar-event-video-row>
  <img slot="icon" class="icon-video" src="" alt="" />
  <span
    slot="label"
    class="row-label"
    data-l10n-id="calendar-event-video-label"
  ></span>
  <div slot="content" class="calendar-event-video-content">
    <input
      class="calendar-event-video-url"
      type="text"
      data-l10n-id="calendar-event-video-url"
    />
    <button
      class="button button-flat icon-button icon-only
        calendar-event-clear-video-url"
      type="button"
      data-l10n-id="calendar-event-video-url-clear"
    ></button>
  </div>
</calendar-event-video-row>
