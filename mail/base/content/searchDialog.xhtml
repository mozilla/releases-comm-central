#filter substitution
#define SEARCH_WINDOW

<!DOCTYPE html [
  <!ENTITY % messengerDTD SYSTEM "chrome://messenger/locale/messenger.dtd" >
  %messengerDTD;
]>
<html id="searchMailWindow" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      windowtype="mailnews:search"
      scrolling="false"
      style="min-width:52em; min-height:34em;"
      lightweightthemes="true"
      persist="screenX screenY width height sizemode">
<head>
  <title data-l10n-id="search-dialog-title"></title>
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src chrome:; script-src chrome: 'unsafe-inline' moz-src:; style-src chrome: 'unsafe-inline'"
  />
  <link rel="stylesheet" href="chrome://messenger/skin/searchDialog.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/tagColors.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/input-fields.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/themeableDialog.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/colors.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/folderMenus.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/contextMenu.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/shared/tree-listbox.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/shared/threadPane.css" />
  <link rel="localization" href="messenger/messenger.ftl" />
  <link rel="localization" href="messenger/searchWidgets.ftl" />
  <link rel="localization" href="messenger/searchDialog.ftl" />
  <link rel="localization" href="messenger/treeView.ftl" />
  <link rel="localization" href="messenger/about3Pane.ftl" />
  <script defer="defer" src="chrome://messenger/content/globalOverlay.js"></script>
  <script defer="defer" src="chrome://global/content/editMenuOverlay.js"></script>
  <script defer="defer" src="chrome://messenger/content/searchWidgets.js"></script>
  <script defer="defer" src="chrome://messenger/content/mailWindow.js"></script>
  <script defer="defer" src="chrome://communicator/content/utilityOverlay.js"></script>
  <script defer="defer" src="chrome://messenger-newsblog/content/newsblogOverlay.js"></script>
  <script defer="defer" src="chrome://messenger/content/searchTerm.js"></script>
  <script defer="defer" src="chrome://messenger/content/dateFormat.js"></script>
  <script defer="defer" src="chrome://messenger/content/messenger.js"></script>
  <script defer="defer" src="chrome://messenger/content/pane-splitter.js"></script>
  <script defer="defer" src="chrome://messenger/content/searchDialog.js"></script>
  <script type="module" src="chrome://messenger/content/tree-view.mjs"></script>
  <script type="module" src="chrome://messenger/content/thread-row.mjs"></script>
</head>
<html:body xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
  <stringbundle id="bundle_messenger" src="chrome://messenger/locale/messenger.properties"/>
  <stringbundle id="bundle_brand" src="chrome://branding/locale/brand.properties"/>

  <commands id="commands">
    <commandset id="mailSearchItems"
                commandupdater="true"
                events="mail-search"
                oncommandupdate="goUpdateSearchItems(this)">
      <command id="cmd_open" oncommand="goDoCommand('cmd_open')" disabled=""/>
      <command id="button_delete" oncommand="goDoCommand('button_delete')" disabled=""/>
      <command id="open_in_folder_button" oncommand="goDoCommand('open_in_folder_button')" disabled=""/>
      <command id="saveas_vf_button" oncommand="goDoCommand('saveas_vf_button')"/>
      <command id="file_message_button" oncommand="MoveMessageInSearch(event.target._folder);" disabled=""/>
      <command id="cmd_delete" oncommand="goDoCommand('cmd_delete')" disabled=""/>
      <command id="cmd_shiftDelete" oncommand="goDoCommand('cmd_shiftDelete');"/>
    </commandset>
  </commands>

  <keyset id="mailKeys">
    <key data-l10n-id="close-cmd" modifiers="accel" oncommand="window.close();"/>
    <key keycode="VK_ESCAPE" oncommand="window.close();"/>
#ifdef XP_MACOSX
      <key id="key_delete" keycode="VK_BACK"     command="cmd_delete"/>
      <key id="key_delete2" keycode="VK_DELETE"  command="cmd_delete"/>
      <key id="cmd_shiftDelete" keycode="VK_BACK"
           oncommand="goDoCommand('cmd_shiftDelete');" modifiers="shift"/>
      <key id="cmd_shiftDelete2" keycode="VK_DELETE"
           oncommand="goDoCommand('cmd_shiftDelete');" modifiers="shift"/>
#else
      <key id="key_delete" keycode="VK_DELETE" command="cmd_delete"/>
      <key id="cmd_shiftDelete" keycode="VK_DELETE"
           oncommand="goDoCommand('cmd_shiftDelete');" modifiers="shift"/>
#endif
  </keyset>

    <vbox id="searchTerms" class="themeable-brighttext" persist="height">
      <vbox>
        <hbox align="center">
          <label data-l10n-id="search-heading"
                 control="searchableFolders"/>
          <menulist id="searchableFolders" class="folderMenuItem"
                    displayformat="verbose">
            <menupopup is="folder-menupopup" class="menulist-menupopup"
                       mode="search" showAccountsFileHere="true" showFileHereLabel="true"
                       oncommand="updateSearchFolderPicker(event.target._folder);"/>
          </menulist>
          <spacer style="flex: 10 10;"/>
          <button id="search-button"
                  data-l10n-id="search-button"
                  oncommand="onSearchButton(event);"
                  default="true"/>
        </hbox>

        <hbox align="center">
          <checkbox id="checkSearchSubFolders"
                    data-l10n-id="search-subfolders"
                    checked=""
                    persist="checked"/>
          <spacer style="flex: 10 10;"/>
           <button id="clear-button"
                   data-l10n-id="clear-button"
                   oncommand="onResetSearch(event);"/>
        </hbox>
        <hbox align="center">
          <checkbox id="checkSearchOnline"
                    data-l10n-id="search-on-server"
                    oncommand="updateSearchLocalSystem();"
                    persist="checked"/>
        </hbox>
      </vbox>

      <hbox style="flex: 1 1 0; min-height: 0;">
        <vbox id="searchTermListBox" flex="1">
#include ../../../mailnews/search/content/searchTerm.inc.xhtml
      </hbox>
    </vbox>

    <splitter id="gray_horizontal_splitter" persist="state" orient="vertical"/>

    <vbox id="searchResults" persist="height">
      <vbox id="searchResultListBox" flex="1">
        <html:tree-view id="threadTree"></html:tree-view>
      </vbox>
      <hbox align="start">
        <button id="openButton" data-l10n-id="open-button" command="cmd_open"/>
        <button id="fileMessageButton" type="menu" data-l10n-id="move-button"
                command="file_message_button">
          <menupopup is="folder-menupopup" showFileHereLabel="true" mode="filing"/>
        </button>


        <button id="deleteButton" data-l10n-id="delete-button" command="button_delete"/>
        <button id="openInFolderButton" data-l10n-id="open-in-folder" command="open_in_folder_button" />
        <button id="saveAsVFButton" data-l10n-id="save-as-vf-button" command="saveas_vf_button" />
      <spacer flex="1" />
    </hbox>
  </vbox>

  <hbox id="status-bar" class="statusbar chromeclass-status" role="status">
    <label id="statusText" class="statusbarpanel" crop="end" flex="1"/>
    <hbox id="statusbar-progresspanel" class="statusbarpanel statusbarpanel-progress" hidden="hidden">
      <html:progress class="progressmeter-statusbar" id="statusbar-icon"/>
    </hbox>
  </hbox>

  <template id="threadPaneRowTemplate" xmlns="http://www.w3.org/1999/xhtml">
    <!-- This template must be kept in sync with ThreadPaneColumns.mjs,
         and with the same template in about3Pane.xhtml. Except for the
         thread column, that isn't used here. -->
    <td class="selectcol-column" data-column-name="selectcol"></td>
    <td class="tree-view-row-flag flaggedcol-column button-column" data-column-name="flaggedcol">
      <button type="button"
              class="button-flat tree-button-flag"
              aria-hidden="hidden"
              tabindex="-1">
        <img src="" alt="" />
      </button>
    </td>
    <td class="attachmentcol-column button-column" data-column-name="attachmentcol">
      <img src="" data-l10n-id="tree-list-view-row-attach" />
    </td>
    <td class="subjectcol-column" data-column-name="subjectcol">
      <div class="thread-container">
        <button type="button"
                class="button button-flat twisty"
                aria-hidden="hidden"
                keyNav="false"
                tabindex="-1">
          <img src="" alt="" class="twisty-icon" />
        </button>
        <div class="subject-line" tabindex="-1">
          <img src="" alt="" /><span></span>
        </div>
      </div>
    </td>
    <td class="tree-view-row-unread unreadbuttoncolheader-column button-column" data-column-name="unreadcol">
      <button type="button"
              class="button-flat tree-button-unread"
              aria-hidden="hidden"
              tabindex="-1">
        <img src="" alt="" />
      </button>
    </td>
    <td class="sendercol-column" data-column-name="sendercol"></td>
    <td class="recipientcol-column" data-column-name="recipientcol"></td>
    <td class="correspondentcol-column" data-column-name="correspondentcol"></td>
    <td class="tree-view-row-spam junkstatuscol-column button-column" data-column-name="junkstatuscol">
      <button type="button"
              class="button-flat tree-button-spam"
              aria-hidden="hidden"
              tabindex="-1">
        <img src="" alt="" />
      </button>
    </td>
    <td class="datecol-column" data-column-name="datecol"></td>
    <td class="receivedcol-column" data-column-name="receivedcol"></td>
    <td class="statuscol-column" data-column-name="statuscol"></td>
    <td class="sizecol-column" data-column-name="sizecol"></td>
    <td class="tagscol-column" data-column-name="tagscol"></td>
    <td class="accountcol-column" data-column-name="accountcol"></td>
    <td class="prioritycol-column" data-column-name="prioritycol"></td>
    <td class="unreadcol-column" data-column-name="unreadcol"></td>
    <td class="totalcol-column" data-column-name="totalcol"></td>
    <td class="locationcol-column" data-column-name="locationcol"></td>
    <td class="idcol-column" data-column-name="idcol"></td>
    <td class="tree-view-row-delete deletecol-column button-column" data-column-name="deletecol">
      <button type="button"
              class="button-flat tree-button-delete tree-button-request-delete"
              tabindex="-1"
              aria-hidden="hidden"
              data-l10n-id="tree-list-view-row-delete">
        <img src="" alt="" />
      </button>
      <button type="button"
              class="button-flat tree-button-restore tree-button-request-delete"
              tabindex="-1"
              aria-hidden="hidden"
              data-l10n-id="tree-list-view-row-restore">
        <img src="" alt="" />
      </button>
    </td>
  </template>

</html:body>
</html>
