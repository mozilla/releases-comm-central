# For installers, stubs, msi (ie not updates) ...
# Products containing "latest" are for www.mozilla.org via cron-bouncer-check
# Products using versions are for release automation via release-bouncer-check-Thunderbird

products:
  installer:
    product-name: Thunderbird-%(version)s
    platforms:
      - linux64
      - osx
      - win
      - win64
