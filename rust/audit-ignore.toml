# RustSec advisories that the scheduled cargo audit of comm/rust/Cargo.lock
# (taskcluster/kinds/cargo-audit) should not report.
#
# Each entry is an [[ignore]] table with all of these keys:
#   id     - the RustSec advisory ID, e.g. "RUSTSEC-2020-0071".
#   bug    - the number of the bug tracking the removal of this entry.
#   reason - why the advisory can be ignored for now.
#
# Entries without a valid id, bug or reason, or with a duplicate id, make the
# audit fail. Remove an entry once its advisory no longer applies.
#
# Example:
#
# [[ignore]]
# id = "RUSTSEC-2026-1234"
# bug = 1234567
# reason = "ignore because of X Y and Z"
